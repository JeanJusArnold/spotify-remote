<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify Remote</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111111">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="/css/style.css">

</head>



<body>


<div class="topbar" id="topbar">
spotify remote
</div>


<div class="content">
<div class="container">


<div class="search">

<button id="searchCloseButton">
<span class="icon-close"></span>
</button>

<div class="search-input-wrap">

<div id="searchGhost" class="search-ghost"><span class="ghost-typed"></span><span class="ghost-suggestion"></span></div>

<input
    id="searchInput"
    type="search"
    placeholder="Recherche"
    autocomplete="off">

</div>

<button id="searchButton">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="11" cy="11" r="7"></circle>
<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
</svg>
</button>

</div>


<div id="searchOverlay">
<div id="overlayHeader">
<button id="overlayBackButton" aria-label="Retour"><svg class="icon-chevron-left" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
<span id="overlayLocation"></span>
</div>
<div id="searchResults"></div>
</div>


<div id="trackActionSheet">
<button id="trackActionQueue" class="track-action-option">Ajouter à la file d'attente</button>
</div>


<div class="now-playing">

<img id="cover" src="" draggable="false">

<div class="track-info">

<div id="track" class="marquee"><span id="trackText">Chargement...</span></div>

<div id="artist" class="marquee"><span id="artistText"></span></div>

</div>

</div>



<div id="time">
0:00 / 0:00
</div>



<input 
    id="seekbar"
    type="range"
    min="0"
    max="1000"
    value="0">



<div class="controls">


<button id="shuffleBtn" class="ctrl-toggle">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<polyline points="16 3 21 3 21 8"></polyline>
<line x1="4" y1="20" x2="21" y2="3"></line>
<polyline points="21 16 21 21 16 21"></polyline>
<line x1="15" y1="15" x2="21" y2="21"></line>
<line x1="4" y1="4" x2="9" y2="9"></line>
</svg>
</button>


<button id="prevBtn">
<span class="icon-prev"></span>
</button>


<button id="play">
<span class="icon-play" id="iconPlay"></span>
<span class="icon-pause" id="iconPause" style="display:none;">
<span></span>
<span></span>
</span>
</button>


<button id="nextBtn">
<span class="icon-next"></span>
</button>


<button id="repeatBtn" class="ctrl-toggle">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<polyline points="17 1 21 5 17 9"></polyline>
<path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
<polyline points="7 23 3 19 7 15"></polyline>
<path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
</svg>
<span id="repeatDot"></span>
</button>


</div>


<div id="manualQueueSection">
<div class="queue-heading">
<span>À suivre dans la file d'attente</span>
</div>
<div id="manualQueueListWrap">
<div id="manualQueueList"></div>
<div id="manualQueueScrollThumb"></div>
</div>
</div>


<div id="queueSection">
<div class="queue-heading">
<span>À suivre</span><span id="queueContext"></span>
</div>
<div id="queueListWrap">
<div id="queueList"></div>
<div id="queueScrollThumb"></div>
</div>
</div>


</div>
</div>




<script type="module" src="/js/ui.js"></script>



</body>
</html>
